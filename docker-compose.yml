# Compose file targets Zimaboard 2 deployment. See ARCHITECTURE.md.
# Zimaboard 2 runs ZimaOS (Debian-based) with a modern Docker engine, so the
# DS713+ workarounds are gone: standard bridge networking with a `ports:` mapping
# works fine, and relative volume paths resolve against the repo directory.
# For local dev testing, use `docker run` directly with your own paths.

services:
  eink-frame:
    build: .
    image: eink-frame:latest
    container_name: eink-frame
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
